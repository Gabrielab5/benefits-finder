<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141c33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f1d1d"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9d174d"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#166534"/><stop offset="1" stop-color="#65a30d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow2)"/>

  <!-- card stack -->
  <g filter="url(#shadow)">
    <g transform="translate(860 70) rotate(-12)">
      <rect width="300" height="186" rx="22" fill="url(#c3)"/>
      <text x="24" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#ecfccb">REBAR</text>
    </g>
    <g transform="translate(900 110) rotate(-4)">
      <rect width="300" height="186" rx="22" fill="url(#c2)"/>
      <text x="24" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#fce7f3">max</text>
    </g>
    <g transform="translate(930 150) rotate(5)">
      <rect width="300" height="186" rx="22" fill="url(#c1)"/>
      <text x="24" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#fee2e2">SHUFERSAL</text>
      <rect x="24" y="128" width="46" height="34" rx="7" fill="#fde68a" opacity="0.85"/>
      <rect x="196" y="124" width="84" height="40" rx="20" fill="#0b1020" opacity="0.55"/>
      <text x="238" y="151" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#34d399">₪90</text>
    </g>
  </g>

  <!-- logo + text -->
  <rect x="72" y="84" width="84" height="84" rx="22" fill="#1b2338" stroke="#2a3552"/>
  <text x="114" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#34d399">₪</text>
  <text x="72" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#e8ecf5">Benefits Finder</text>
  <text x="72" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#94a3c4">Which card should I pull out at the register? Answered in a second.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="72" y="314" width="150" height="36" rx="18" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="147" y="338" text-anchor="middle" fill="#34d399">198 stores</text>
    <rect x="234" y="314" width="160" height="36" rx="18" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="314" y="338" text-anchor="middle" fill="#34d399">167 benefits</text>
    <rect x="406" y="314" width="190" height="36" rx="18" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.4"/>
    <text x="501" y="338" text-anchor="middle" fill="#f472b6">🎂 birthday perks</text>
    <rect x="608" y="314" width="150" height="36" rx="18" fill="#94a3c4" fill-opacity="0.12" stroke="#94a3c4" stroke-opacity="0.35"/>
    <text x="683" y="338" text-anchor="middle" fill="#cbd5e1">₪0 to run</text>
  </g>
</svg>
